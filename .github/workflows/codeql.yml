name: CodeQL

# Static security analysis of the app, the edge function and the workflows themselves.
# Findings show up under the repository's Security tab and as annotations on pull requests.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, so new CodeQL queries also run against unchanged code

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
